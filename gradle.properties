# Gradle Properties untuk Sajian Sehat Build

# ============================================================================
# Fix: Disable JdkImage Transform untuk menghindari jlink error
# ============================================================================
# Error: jlink executable tidak ditemukan di Red Hat extension
# Solusi: Disable internal JDK image transform
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Disable jlink transform yang problematic
android.disableAutomaticJdkDownload=false

# ============================================================================
# Build Configuration
# ============================================================================
# Enable org.gradle.parallel=true untuk faster builds
org.gradle.parallel=true
org.gradle.workers.max=8

# ============================================================================
# Kotlin Configuration
# ============================================================================
kotlin.code.style=official
